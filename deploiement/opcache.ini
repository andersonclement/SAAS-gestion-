; Réglages OPcache pour la production.
;
; PHP recompile par défaut chaque fichier à chaque requête. Sur un petit VPS,
; activer le cache d'opcode change l'ordre de grandeur du temps de réponse :
; c'est le réglage le plus rentable de la pile, et il ne coûte que de la
; mémoire.
;
; Installé par preparer-serveur.sh dans le répertoire de configuration de
; PHP-FPM (conf.d), pas dans celui de la CLI : les commandes artisan sont
; ponctuelles et n'y gagneraient rien.

opcache.enable=1

; 128 Mo suffisent très largement pour cette base de code ; surveiller
; opcache_get_status()['memory_usage']['free_memory'] si elle grossit.
opcache.memory_consumption=128
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=20000

; Le code ne change qu'au déploiement, et deployer.sh recharge PHP-FPM à
; chaque passage : inutile que PHP aille interroger l'horodatage des fichiers
; à chaque requête.
opcache.validate_timestamps=0

; Journalise les erreurs d'OPcache dans le log PHP-FPM plutôt qu'en silence.
opcache.log_verbosity_level=1

; Ne jamais exposer le détail des chemins et des fichiers compilés.
opcache.restrict_api=

; Sécurité indépendante d'OPcache, mais qui a sa place dans la configuration
; de production : n'exécuter que des fichiers existants et ne pas divulguer
; la version de PHP dans les en-têtes.
cgi.fix_pathinfo=0
expose_php=Off
