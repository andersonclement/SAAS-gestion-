# Configuration nginx de Gestion Stock.
#
# Installée par preparer-serveur.sh dans /etc/nginx/sites-available/, qui y
# remplace __DOMAINE__ et __RACINE__ par les valeurs déclarées en tête du
# script. Ne pas éditer la copie du serveur : modifier ce fichier, puis
# relancer preparer-serveur.sh.
#
# Ce fichier décrit l'écoute en HTTP seul. certbot --nginx ajoute lui-même le
# bloc 443, le certificat et la redirection : le lancer APRÈS que
# l'enregistrement DNS pointe sur le serveur.

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAINE__;

    # La racine web est public/, jamais le répertoire de l'application :
    # sinon .env, les migrations et le code source deviendraient
    # téléchargeables.
    root __RACINE__/public;
    index index.php;

    charset utf-8;

    # Taille des requêtes : l'application ne reçoit aucun téléversement, une
    # limite basse réduit la surface d'attaque.
    client_max_body_size 2m;

    # Masque la version de nginx dans les en-têtes et les pages d'erreur.
    server_tokens off;

    access_log /var/log/nginx/gestion-stock.access.log;
    error_log  /var/log/nginx/gestion-stock.error.log;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # Les feuilles de style et le script d'interface ne changent qu'au
    # déploiement : on les met en cache côté navigateur.
    location ~* \.(css|js|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
        try_files $uri =404;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass unix:/run/php/php__PHP_VERSION__-fpm.sock;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;

        # Transmet le protocole d'origine. Sans cela l'application se croit en
        # HTTP derrière le proxy TLS et n'émet pas l'en-tête HSTS.
        fastcgi_param HTTP_X_FORWARDED_PROTO $scheme;

        # Une page lente vaut mieux qu'une page blanche : 60 s couvrent
        # largement le pire cas (export CSV sur un gros historique).
        fastcgi_read_timeout 60s;
    }

    # Rien d'autre que du PHP ne doit être exécuté, et les fichiers sensibles
    # ne doivent jamais être servis même s'ils atterrissent dans public/.
    location ~ /\.(?!well-known).* { deny all; }
    location ~* \.(env|sql|sqlite|log|bak|ini|sh)$ { deny all; }
}
